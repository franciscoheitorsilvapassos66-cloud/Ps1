# This starter workflow is for a CMake project running on a single platform and packaging into an ISO name: CMake to ISO Compilation on: push: branches: [ "main" ] pull_request: branches: [ "main" ] env: BUILD_TYPE: Release jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - name: Install ISO creation tools run: | sudo apt-get update sudo apt-get install -y genisoimage - name: Configure CMake run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} - name: Build run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} - name: Test working-directory: ${{github.workspace}}/build run: ctest -C ${{env.BUILD_TYPE}} - name: Prepare ISO folder structure run: | mkdir -p ${{github.workspace}}/iso_root # Copia o binário compilado/arquivos necessários para a pasta do ISO # Ajuste o caminho abaixo se o seu executável estiver em outra subpasta de /build cp -r ${{github.workspace}}/build/* ${{github.workspace}}/iso_root/ - name: Create ISO Image run: | genisoimage -o ${{github.workspace}}/projeto_compilado.iso \ -R -J -v -V "MEU_PROJETO" \ ${{github.workspace}}/iso_root/ - name: Upload ISO Artifact uses: actions/upload-artifact@v4 with: name: imagem-iso-compilada path: ${{github.workspace}}/projeto_compilado.iso
